name: join-the-six-dev

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-join_the_six}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-join_the_six}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-join-the-six}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-false}
  BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-}
  BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}

x-dev-service: &dev-service
  build:
    context: .
    target: development
  init: true
  volumes:
    - .:/workspace
    - dev_pnpm_store:/pnpm/store
    - dev_root_node_modules:/workspace/node_modules
    - dev_backend_node_modules:/workspace/apps/backend/node_modules
    - dev_web_node_modules:/workspace/apps/web/node_modules
    - dev_database_node_modules:/workspace/packages/database/node_modules
    - dev_tokens_node_modules:/workspace/packages/design-tokens/node_modules
    - dev_nuxt:/workspace/apps/web/.nuxt

services:
  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-join_the_six}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_USER: ${POSTGRES_USER:-join_the_six}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dev_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dev_redis_data:/data

  dependencies:
    <<: *dev-service
    command: ["pnpm", "install", "--frozen-lockfile", "--prefer-offline"]
    restart: "no"

  migrate:
    <<: *dev-service
    command: ["pnpm", "--filter", "@join-the-six/database", "db:migrate"]
    environment:
      <<: *app-environment
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *dev-service
    command: ["pnpm", "--filter", "@join-the-six/backend", "dev"]
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    <<: *dev-service
    command:
      ["pnpm", "--filter", "@join-the-six/web", "dev", "--host", "0.0.0.0"]
    environment:
      NODE_ENV: development
      NUXT_API_BASE_INTERNAL: http://api:4000/api/v1
      NUXT_PUBLIC_API_BASE: http://localhost:${API_HOST_PORT:-4000}/api/v1
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_pnpm_store:
  dev_root_node_modules:
  dev_backend_node_modules:
  dev_web_node_modules:
  dev_database_node_modules:
  dev_tokens_node_modules:
  dev_nuxt:
