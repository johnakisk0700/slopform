name: join-the-six-dev

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-join_the_six}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-join_the_six}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-join-the-six}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-false}
  BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-}
  BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}

x-dev-service: &dev-service
  build:
    context: .
    target: development
  init: true
  volumes:
    - .:/workspace
    - dev_root_node_modules:/workspace/node_modules
    - dev_backend_node_modules:/workspace/apps/backend/node_modules
    - dev_web_node_modules:/workspace/apps/web/node_modules
    - dev_database_node_modules:/workspace/packages/database/node_modules
    - dev_tokens_node_modules:/workspace/packages/design-tokens/node_modules

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-join_the_six}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_USER: ${POSTGRES_USER:-join_the_six}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dev_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dev_redis_data:/data

  api:
    <<: *dev-service
    command: pnpm --filter @join-the-six/backend dev:http
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *dev-service
    command: pnpm --filter @join-the-six/backend dev:worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: join-the-six-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *dev-service
    command: pnpm --filter @join-the-six/web dev --host 0.0.0.0
    environment:
      NODE_ENV: development
      NUXT_API_BASE_INTERNAL: http://api:4000/api/v1
      NUXT_PUBLIC_API_BASE: http://localhost:4000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    volumes:
      - .:/workspace
      - dev_root_node_modules:/workspace/node_modules
      - dev_backend_node_modules:/workspace/apps/backend/node_modules
      - dev_web_node_modules:/workspace/apps/web/node_modules
      - dev_database_node_modules:/workspace/packages/database/node_modules
      - dev_tokens_node_modules:/workspace/packages/design-tokens/node_modules
      - dev_nuxt:/workspace/apps/web/.nuxt

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_root_node_modules:
  dev_backend_node_modules:
  dev_web_node_modules:
  dev_database_node_modules:
  dev_tokens_node_modules:
  dev_nuxt:
