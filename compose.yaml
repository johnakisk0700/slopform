name: join-the-six-dev

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-join_the_six}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-join_the_six}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  MONGODB_URI: mongodb://${MONGODB_APP_USER:-join_the_six}:${MONGODB_APP_PASSWORD:-local_only_change_me}@mongo:27017/${MONGODB_DB:-join_the_six}?authSource=${MONGODB_DB:-join_the_six}&retryWrites=false
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-join-the-six}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-false}
  BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-}
  BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}

x-dev-service: &dev-service
  image: ${COMPOSE_PROJECT_NAME:-join-the-six-dev}-development:local
  pull_policy: never
  init: true
  volumes:
    - .:/workspace
    - dev_pnpm_store:/pnpm/store
    - dev_root_node_modules:/workspace/node_modules
    - dev_backend_node_modules:/workspace/apps/backend/node_modules
    - dev_admin_node_modules:/workspace/apps/admin/node_modules
    - dev_database_node_modules:/workspace/packages/database/node_modules
    - dev_tokens_node_modules:/workspace/packages/design-tokens/node_modules

services:
  dev-image:
    image: ${COMPOSE_PROJECT_NAME:-join-the-six-dev}-development:local
    pull_policy: never
    build:
      context: .
      target: development
      args:
        DEV_GID: ${DEV_GID:-1000}
        DEV_UID: ${DEV_UID:-1000}
    command: ["true"]
    restart: "no"

  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-join_the_six}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_USER: ${POSTGRES_USER:-join_the_six}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dev_postgres_data:/var/lib/postgresql

  mongo:
    image: mongo:8.0.28-noble@sha256:277f9152905bd1f32d3ece4526e0f90906dc238f7133b24ede8446ac9740b76d
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-join_the_six}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-local_only_change_me}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-join_the_six_root}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:-local_only_change_me}
      MONGODB_APP_USER: ${MONGODB_APP_USER:-join_the_six}
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27017}:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$${MONGODB_APP_USER}" --password "$${MONGODB_APP_PASSWORD}" --authenticationDatabase "$${MONGO_INITDB_DATABASE}" "$${MONGO_INITDB_DATABASE}" --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
      - dev_mongodb_data:/data/db

  redis:
    image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dev_redis_data:/data

  dependencies:
    <<: *dev-service
    user: "0:0"
    environment:
      CI: "true"
    command:
      - sh
      - -ec
      - pnpm install --frozen-lockfile --prefer-offline && install -d -o node -g node /workspace/apps/admin/node_modules/.vite
    depends_on:
      dev-image:
        condition: service_completed_successfully
    restart: "no"

  migrate:
    <<: *dev-service
    command: ["pnpm", "--filter", "@join-the-six/database", "db:migrate"]
    environment:
      <<: *app-environment
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *dev-service
    command: ["pnpm", "--filter", "@join-the-six/backend", "dev"]
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 4000
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
      CLERK_ADMIN_USER_IDS: ${CLERK_ADMIN_USER_IDS:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      FEEDBACK_ATTENTION_REASONING_EFFORT: ${FEEDBACK_ATTENTION_REASONING_EFFORT:-}
      FEEDBACK_EXPIRE_AFTER_HOURS: ${FEEDBACK_EXPIRE_AFTER_HOURS:-}
      FEEDBACK_EXTRACTION_MODEL: ${FEEDBACK_EXTRACTION_MODEL:-}
      FEEDBACK_EXTRACTION_REASONING_EFFORT: ${FEEDBACK_EXTRACTION_REASONING_EFFORT:-}
      FEEDBACK_EXTRACTION_SERVICE_TIER: ${FEEDBACK_EXTRACTION_SERVICE_TIER:-}
      FEEDBACK_EXTRACTION_STUB: ${FEEDBACK_EXTRACTION_STUB:-false}
      FEEDBACK_INGRESS_PENDING_RECOVERY_MINUTES: ${FEEDBACK_INGRESS_PENDING_RECOVERY_MINUTES:-}
      FEEDBACK_MAX_REMINDERS: ${FEEDBACK_MAX_REMINDERS:-}
      FEEDBACK_OPERATOR_ALERT_MODE: ${FEEDBACK_OPERATOR_ALERT_MODE:-}
      FEEDBACK_PRODUCTION_REHEARSAL_ENABLED: ${FEEDBACK_PRODUCTION_REHEARSAL_ENABLED:-false}
      FEEDBACK_REMINDER_AFTER_HOURS: ${FEEDBACK_REMINDER_AFTER_HOURS:-}
      FEEDBACK_SIMULATOR_ENABLED: ${FEEDBACK_SIMULATOR_ENABLED:-false}
      FEEDBACK_SUMMARY_MODEL: ${FEEDBACK_SUMMARY_MODEL:-}
      FEEDBACK_SUMMARY_REASONING_EFFORT: ${FEEDBACK_SUMMARY_REASONING_EFFORT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TRANSPORT_MODE: ${TRANSPORT_MODE:-simulated}
      WASENDER_SESSION_API_KEY: ${WASENDER_SESSION_API_KEY:-}
      WASENDER_WEBHOOK_ENABLED: ${WASENDER_WEBHOOK_ENABLED:-false}
      WASENDER_WEBHOOK_SECRET: ${WASENDER_WEBHOOK_SECRET:-}
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    <<: *dev-service
    command:
      ["pnpm", "--filter", "@join-the-six/admin", "dev", "--host", "0.0.0.0"]
    environment:
      NODE_ENV: development
      # Vite proxies /api to the API service inside the compose network.
      API_PROXY_TARGET: http://api:4000
      VITE_API_BASE: ${VITE_API_BASE:-/api}
      VITE_AUTH_DEV_BYPASS: ${VITE_AUTH_DEV_BYPASS:-false}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  dev_mongodb_data:
  dev_postgres_data:
  dev_redis_data:
  dev_pnpm_store:
  dev_root_node_modules:
  dev_backend_node_modules:
  dev_admin_node_modules:
  dev_database_node_modules:
  dev_tokens_node_modules:
