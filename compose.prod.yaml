name: join-the-six

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-backend-environment: &backend-environment
  NODE_ENV: production
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  FEEDBACK_EXTRACTION_MODEL: ${FEEDBACK_EXTRACTION_MODEL:-}
  MONGODB_APP_USER: ${MONGODB_APP_USER:?Set MONGODB_APP_USER in .env.production}
  MONGODB_DB: ${MONGODB_DB:?Set MONGODB_DB in .env.production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-join-the-six-api}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  REFERENCE_MODULE_ENABLED: ${REFERENCE_MODULE_ENABLED:-false}
  WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env.production}

services:
  postgres:
    <<: *service-defaults
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data

  mongo:
    <<: *service-defaults
    image: mongo:8.0.28-noble@sha256:277f9152905bd1f32d3ece4526e0f90906dc238f7133b24ede8446ac9740b76d
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:?Set MONGODB_DB in .env.production}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:?Set MONGODB_ROOT_USER in .env.production}
      MONGODB_APP_PASSWORD_FILE: /run/secrets/mongodb_app_password
      MONGODB_APP_USER: ${MONGODB_APP_USER:?Set MONGODB_APP_USER in .env.production}
    secrets:
      - mongodb_app_password
      - mongodb_root_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$${MONGODB_APP_USER}" --password "$$(cat /run/secrets/mongodb_app_password)" --authenticationDatabase "$${MONGO_INITDB_DATABASE}" "$${MONGO_INITDB_DATABASE}" --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
      - mongodb_data:/data/db
    networks:
      - data

  redis:
    <<: *service-defaults
    image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - data

  migrate:
    <<: *service-defaults
    image: join-the-six-migrate:${RELEASE_TAG:?Set RELEASE_TAG to the deployed Git SHA}
    build:
      context: .
      target: migrate
    init: true
    environment:
      MIGRATION_CONNECT_TIMEOUT_MS: ${MIGRATION_CONNECT_TIMEOUT_MS:-10000}
      MIGRATION_EXECUTION_TIMEOUT_MS: ${MIGRATION_EXECUTION_TIMEOUT_MS:-600000}
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-15000}
      MIGRATION_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-300000}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - data

  api:
    <<: *service-defaults
    image: join-the-six-api:${RELEASE_TAG:?Set RELEASE_TAG to the deployed Git SHA}
    build:
      context: .
      target: api
    init: true
    environment:
      <<: *backend-environment
      API_HOST: 0.0.0.0
      API_PORT: 4000
      BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-false}
      BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-}
      CLERK_ADMIN_USER_IDS: ${CLERK_ADMIN_USER_IDS:?Set CLERK_ADMIN_USER_IDS in .env.production}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY in .env.production}
      WASENDER_WEBHOOK_ENABLED: ${WASENDER_WEBHOOK_ENABLED:-false}
    secrets:
      - bull_board_password
      - clerk_secret_key
      - mongodb_app_password
      - openai_api_key
      - openrouter_api_key
      - postgres_password
      - redis_password
      - wasender_webhook_secret
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data
      - edge

  worker:
    <<: *service-defaults
    image: join-the-six-worker:${RELEASE_TAG:?Set RELEASE_TAG to the deployed Git SHA}
    build:
      context: .
      target: worker
    init: true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: join-the-six-worker
    secrets:
      - mongodb_app_password
      - openai_api_key
      - openrouter_api_key
      - postgres_password
      - redis_password
      - wasender_session_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
      - egress

  web:
    <<: *service-defaults
    image: join-the-six-web:${RELEASE_TAG:?Set RELEASE_TAG to the deployed Git SHA}
    build:
      context: .
      target: web
      args:
        VITE_API_BASE: /api
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in .env.production}
    init: true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      # Caddy keeps its state on the in-memory /tmp so the root stays read-only.
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - edge

  caddy:
    <<: *service-defaults
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - edge

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  data:
    internal: true
  edge:
  egress:

secrets:
  bull_board_password:
    file: ${BULL_BOARD_PASSWORD_FILE:?Set BULL_BOARD_PASSWORD_FILE in .env.production}
  clerk_secret_key:
    file: ${CLERK_SECRET_KEY_FILE:?Set CLERK_SECRET_KEY_FILE in .env.production}
  mongodb_app_password:
    file: ${MONGODB_APP_PASSWORD_FILE:?Set MONGODB_APP_PASSWORD_FILE in .env.production}
  mongodb_root_password:
    file: ${MONGODB_ROOT_PASSWORD_FILE:?Set MONGODB_ROOT_PASSWORD_FILE in .env.production}
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:?Set OPENAI_API_KEY_FILE in .env.production}
  openrouter_api_key:
    file: ${OPENROUTER_API_KEY_FILE:?Set OPENROUTER_API_KEY_FILE in .env.production}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE in .env.production}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?Set REDIS_PASSWORD_FILE in .env.production}
  wasender_webhook_secret:
    file: ${WASENDER_WEBHOOK_SECRET_FILE:?Set WASENDER_WEBHOOK_SECRET_FILE in .env.production}
  wasender_session_api_key:
    file: ${WASENDER_SESSION_API_KEY_FILE:?Set WASENDER_SESSION_API_KEY_FILE in .env.production}
