# Host edge for the private Join The Six admin. Docker services bind only to
# loopback; native nginx remains the sole owner of ports 80/443 on the shared
# VPS. The apex example.com vhost is intentionally managed separately.
server {
    listen 80;
    listen [::]:80;
    server_name slopform.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://slopform.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slopform.example.com;

    ssl_certificate /etc/letsencrypt/live/slopform.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slopform.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Assistant generation remains durable when the connection drops. Keep
        # the edge ready for its live accelerator without buffering deltas.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
