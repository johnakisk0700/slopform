name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Validate container configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --env-file .env.production.example -f compose.prod.yaml config --quiet

  containers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: false
          set: |
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,mode=max,scope=web
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,mode=max,scope=api
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,mode=max,scope=worker
            migrate.cache-from=type=gha,scope=migrate
            migrate.cache-to=type=gha,mode=max,scope=migrate
