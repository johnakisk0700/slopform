name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Validate container configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --env-file .env.production.example -f compose.prod.yaml config --quiet

  containers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          RELEASE_TAG: ${{ github.sha }}
        with:
          source: .
          files: docker-bake.hcl
          push: false
          set: |
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,mode=max,scope=web
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,mode=max,scope=api
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,mode=max,scope=worker
            migrate.cache-from=type=gha,scope=migrate
            migrate.cache-to=type=gha,mode=max,scope=migrate
