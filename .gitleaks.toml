title = "Slopform secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Backend specs use UUID fixtures for lease, claim, and idempotency tokens."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/backend/src/.*\.spec\.ts$''']
regexes = ['''\b(?:claimToken|leaseToken|idempotencyKey|secondToken|reclaimedToken)\b\s*[:=]\s*["'][0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}["']''']
